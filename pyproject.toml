[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiff-to-powerpoint"
version = "1.0.1"
description = "Desktop GUI for arranging paired TIFF images in PowerPoint presentations"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "TIFF to PowerPoint contributors" }]
dependencies = [
    "Pillow>=10.4,<13",
    "python-pptx>=1.0.2,<2",
    "PySide6-Essentials>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=5,<8",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.gui-scripts]
tiff-to-powerpoint = "tiff_to_powerpoint.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
